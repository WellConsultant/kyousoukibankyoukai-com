  const genreTabs = document.getElementById('genreTabs');
  const videoGrid = document.getElementById('videoGrid');
  const videoCount = document.getElementById('videoCount');
  const emptyState = document.getElementById('emptyState');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalVideoWrap = document.getElementById('modalVideoWrap');
  const modalTitle = document.getElementById('modalTitle');
  const modalClose = document.getElementById('modalClose');

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }

  function cardHtml(v) {
    const thumbStyle = v.thumbnail
      ? 'background-image:url(\'' + v.thumbnail + '\');'
      : '';
    return (
      '<div class="video-card" data-id="' + v.id + '" data-title="' + escapeHtml(v.title) + '">' +
        '<div class="video-thumb" style="' + thumbStyle + '">' +
          '<div class="play-badge"><svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg></div>' +
        '</div>' +
        '<div class="video-body">' +
          '<span class="video-genre-tag">' + escapeHtml(v.genre) + '</span>' +
          '<p class="video-title">' + escapeHtml(v.title) + '</p>' +
          '<div class="video-date">' + formatDate(v.created_time) + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(genre) {
    const list = genre === 'all' ? VIDEOS : VIDEOS.filter(function (v) { return v.genre === genre; });
    videoCount.textContent = list.length + '本の動画';
    videoGrid.innerHTML = list.map(cardHtml).join('');
    emptyState.style.display = list.length === 0 ? 'block' : 'none';
  }

  genreTabs.addEventListener('click', function (e) {
    const btn = e.target.closest('.genre-tab');
    if (!btn) return;
    genreTabs.querySelectorAll('.genre-tab').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    render(btn.dataset.genre);
  });

  videoGrid.addEventListener('click', function (e) {
    const card = e.target.closest('.video-card');
    if (!card) return;
    openModal(card.dataset.id, card.dataset.title);
  });

  function openModal(id, title) {
    modalVideoWrap.innerHTML =
      '<iframe src="https://player.vimeo.com/video/' + id + '?badge=0&autopause=0&player_id=0&app_id=502819&autoplay=1" ' +
      'frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write" ' +
      'title="' + escapeHtml(title) + '" allowfullscreen></iframe>';
    modalTitle.textContent = title;
    modalOverlay.classList.add('open');
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    modalVideoWrap.innerHTML = '';
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  render('all');
</script>
